include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Imports: one style everywhere, sorted.
    - always_use_package_imports
    - directives_ordering
    # Style
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    # Bug prevention
    - avoid_print
    - unawaited_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
